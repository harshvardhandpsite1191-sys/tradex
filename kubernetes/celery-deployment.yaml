apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiqros-celery-worker
  namespace: ai-qros-prod
  labels:
    app: aiqros-celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiqros-celery-worker
  template:
    metadata:
      labels:
        app: aiqros-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: aiqros-backend:latest
          command:
            - celery
            - -A
            - celery_app
            - worker
            - --loglevel=info
            - --queues=data,quality,features,research,learning
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aiqros-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aiqros-secrets
                  key: redis-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aiqros-celery-worker-hpa
  namespace: ai-qros-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aiqros-celery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiqros-celery-beat
  namespace: ai-qros-prod
  labels:
    app: aiqros-celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiqros-celery-beat
  template:
    metadata:
      labels:
        app: aiqros-celery-beat
    spec:
      containers:
        - name: celery-beat
          image: aiqros-backend:latest
          command:
            - celery
            - -A
            - celery_app
            - beat
            - --loglevel=info
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: aiqros-secrets
                  key: redis-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
