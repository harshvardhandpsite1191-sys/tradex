apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiqros-ingress
  namespace: ai-qros-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # WebSocket support for Phase 20 live streaming
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: aiqros.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aiqros-backend-service
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: aiqros-backend-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiqros-frontend-service
                port:
                  number: 80
---
# Namespaces
apiVersion: v1
kind: Namespace
metadata:
  name: ai-qros-prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-qros-dev
