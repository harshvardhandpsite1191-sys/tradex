version: "3.9"

services:

  # ─────────────────────────────────────────────
  # PostgreSQL (local dev — use Neon in production)
  # ─────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: aiqros_postgres
    environment:
      POSTGRES_DB: aiqros
      POSTGRES_USER: aiqros_user
      POSTGRES_PASSWORD: aiqros_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiqros_user -d aiqros"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (local dev — use Upstash in production)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aiqros_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiqros_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aiqros_user:aiqros_pass@postgres:5432/aiqros
      - DATABASE_URL_SYNC=postgresql://aiqros_user:aiqros_pass@postgres:5432/aiqros
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FRONTEND_URL=http://localhost:3000
      - DEBUG=true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiqros_celery_worker
    command: celery -A celery_app worker --loglevel=info --queues=data,quality,features,research,learning
    environment:
      - DATABASE_URL=postgresql+asyncpg://aiqros_user:aiqros_pass@postgres:5432/aiqros
      - DATABASE_URL_SYNC=postgresql://aiqros_user:aiqros_pass@postgres:5432/aiqros
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Celery Beat (Scheduler)
  # ─────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiqros_celery_beat
    command: celery -A celery_app beat --loglevel=info --scheduler celery.schedulers:PersistentScheduler
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # MLflow Tracking Server (Experiment Tracking)
  # ─────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: aiqros_mlflow
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri postgresql://aiqros_user:aiqros_pass@postgres:5432/aiqros_mlflow
             --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow_data:/mlflow/artifacts
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Prometheus + Grafana Monitoring (Phase 0)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aiqros_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aiqros_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aiqros_admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiqros_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
  grafana_data:
